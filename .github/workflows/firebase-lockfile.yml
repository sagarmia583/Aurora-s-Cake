name: Resolve Firebase lockfile on R11 branch
on:
  push:
    branches: [feat/firebase-firestore-foundation-r11]
    paths:
      - package.json
      - .github/workflows/firebase-lockfile.yml
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'sagarmia583/Aurora-s-Cake'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Save reproducible lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(firebase): resolve firebase-admin npm lockfile"
          git push origin HEAD:feat/firebase-firestore-foundation-r11
