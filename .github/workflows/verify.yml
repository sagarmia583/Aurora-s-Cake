name: Verify bakery app

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit production dependencies (advisory)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Verify Firebase SDK component registry
        run: node scripts/verify-firebase-singleton.cjs
      - name: TypeScript checks
        run: npm run lint
      - name: Unit and integration tests
        run: node node_modules/tsx/dist/cli.mjs --test tests/*.test.ts tests/*.test.tsx
      - name: Install isolated PostgreSQL verifier
        run: npm install --prefix .sql-runtime --no-save --ignore-scripts @electric-sql/pglite@0.5.13
      - name: Verify private Supabase health SQL and role permissions
        run: node scripts/verify-supabase-health.mjs .sql-runtime
      - name: Verify lossless Supabase staging and rollback with PostgreSQL
        run: node scripts/verify-supabase-staging.mjs --fixture --project-ref dtvefwpaxwffxglqbfoo --pglite-module .sql-runtime/node_modules/@electric-sql/pglite/dist/index.js
      - name: Verify private runtime transactions and role isolation with PostgreSQL
        run: node scripts/verify-supabase-runtime.mjs --fixture --project-ref dtvefwpaxwffxglqbfoo --pglite-module .sql-runtime/node_modules/@electric-sql/pglite/dist/index.js
      - name: Production bundle
        run: npm run build
