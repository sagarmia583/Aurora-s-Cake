name: Generate Firebase npm lockfile (one-time)
on:
  push:
    branches: ['feat/firebase-foundation-20261027']
    paths:
      - '.github/workflows/firebase-lockfile.yml'
      - 'package.json'
permissions:
  contents: write
jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    if: github.repository == 'sagarmia583/Aurora-s-Cake'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/firebase-foundation-20261027
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate reproducible npm lockfile without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to Firebase feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(firebase): refresh package lock for Firebase SDK'
            git push origin HEAD:feat/firebase-foundation-20261027
          fi
