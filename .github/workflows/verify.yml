name: Verify bakery app (Netlify + Google Sheets)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY: "true"
      VITE_SHEETS_POST_PROXY: "/api/operations"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit dependencies (advisory)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Verify Netlify + Sheets configuration
        run: node scripts/verify-netlify-sheets-config.mjs
      - name: TypeScript
        run: npm run lint
      - name: Integration tests
        run: node node_modules/tsx/dist/cli.mjs --test tests/*.test.ts tests/*.test.tsx
      - name: Production bundle
        run: npm run build
