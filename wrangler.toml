# Cloudflare Workers + Static Assets deploy target.
# This is the existing aurora-s-cake.sagarmia583.workers.dev project,
# NOT a Cloudflare Pages project. Keep JSON secrets in the Workers dashboard.
name = "aurora-s-cake"
main = "./cloudflare/worker.js"
compatibility_date = "2026-10-29"
# Preserve text runtime variables entered in Cloudflare Dashboard across
# GitHub Workers Builds deployments. Encrypted secrets are still dashboard-only.
keep_vars = true

[vars]
DEPLOYMENT_PLATFORM = "cloudflare_worker"
# Enables server-only *secondary order mirroring*, not Firebase-primary.
# No order is mirrored until authoritative backend confirms it and
# FIREBASE_SERVICE_ACCOUNT_JSON is configured as an encrypted Worker Secret.
FIREBASE_MIRROR_ENABLED = "true"
# Phase 1: isolated public catalog read-only API. The live storefront still
# uses its previous backend until catalog import and checkout migration.
FIREBASE_PRIMARY_CATALOG_ENABLED = "true"
# Phase 2: independent Firebase Auth + private staff_roles, GET-only APIs.
# Does NOT replace the production legacy staff portal until tested.
FIREBASE_PRIMARY_STAFF_ENABLED = "true"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
