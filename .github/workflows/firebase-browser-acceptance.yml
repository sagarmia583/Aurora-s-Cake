name: Firebase browser acceptance (temporary)
on:
  push:
    branches: ['fix/firebase-single-app-registry-20261027']
    paths:
      - '.github/workflows/firebase-browser-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/verify-firebase-singleton.cjs
      - run: npm run build
      - name: Install browser driver for one-off acceptance test
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Start built app
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aurora-preview.log 2>&1 &
          for i in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aurora-preview.log
          exit 1
      - name: Test deployed Firestore permissions from actual Chrome
        run: node scripts/smoke-firebase-browser.mjs
