name: Verify Aurora static build (no publishing)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AURORA_GITHUB_PAGES: "true"
      VITE_GITHUB_PAGES_READ_ONLY: "true"
      VITE_SHARED_BAKERY_API_ORIGIN: ""
      NETLIFY: "false"
      VITE_SHEETS_POST_PROXY: ""
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify shared Netlify API CORS and routing
        run: node --test tests/dual-host-shared-bakery-api.test.mjs
      - name: TypeScript check
        run: npm run lint
      - name: Build Vite project for /Aurora-s-Cake/
        run: npm run build
      - name: Support direct /cake and /track-order links
        run: cp dist/index.html dist/404.html
      - name: Verify Pages artifact and protect against unsafe writes
        run: node scripts/check-github-pages-build.mjs
