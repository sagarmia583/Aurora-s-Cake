name: Verify Cloudflare Workers and Pages

on:
  pull_request:
    paths:
      - 'functions/**'
      - 'cloudflare/**'
      - 'netlify/functions/operations.mjs'
      - 'api/lib/firestoreOrderMirror.js'
      - 'public/_routes.json'
      - 'public/_redirects'
      - 'wrangler.toml'
      - 'tests/cloudflare-pages.test.ts'
      - 'tests/cloudflare-worker.test.ts'
      - 'tests/firebase-primary-catalog.test.ts'
      - 'tests/firebase-staff-auth.test.ts'
      - 'cloudflare/firebaseStaffApi.js'
      - 'cloudflare/firebaseStaffAuth.js'
      - 'src/components/FirebaseStaffPreview.tsx'
      - 'src/services/firebaseAuthErrors.ts'
      - 'tests/firebase-auth-error-ui.test.ts'
      - 'src/main.tsx'
      - 'src/services/firebasePreviewRouting.ts'
      - 'tests/firebase-preview-routing.test.ts'
      - 'scripts/bootstrap-firebase-staff.mjs'
      - 'src/services/firebasePrimaryCatalog.ts'
      - 'src/hooks/useGoogleSheetContent.ts'
      - 'scripts/import-firestore-catalog.mjs'
      - 'wrangler.pages.toml'
      - '.github/workflows/cloudflare-verify.yml'

permissions:
  contents: read

jobs:
  cloudflare-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build Cloudflare Vite storefront with Pages environment
        run: CF_PAGES=1 npm run build
      - name: Reject Pages-style redirect loops in Workers Static Assets
        run: |
          test ! -f public/_redirects
          test ! -f dist/_redirects
          grep -q 'not_found_handling = "single-page-application"' wrangler.toml
          grep -q '^keep_vars = true' wrangler.toml
          grep -q '^FIREBASE_MIRROR_ENABLED = "true"' wrangler.toml
      - name: Validate Cloudflare Worker static-assets deployment bundle (no real deploy)
        run: npx --yes wrangler@4.45.0 deploy --dry-run --outdir .cf-worker-build
      - name: Validate Pages Functions Worker bundle with Wrangler
        run: npx --yes wrangler@4.45.0 pages functions build functions --outdir .cf-ci-build --compatibility-date 2026-10-29
      - name: Confirm routed Functions and static paths
        run: |
          node -e "const a=require('./public/_routes.json');if(a.version!==1||JSON.stringify(a.include)!=='[\"/api/*\"]')process.exit(1)"
