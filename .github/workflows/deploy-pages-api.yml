name: Deploy Aurora GitHub Pages API Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/pages-api/**"
      - "wrangler.pages-api.toml"
      - "tests/pages-api-relay.test.mjs"
      - ".github/workflows/deploy-pages-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-gh-pages-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed main source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify API security and redirect behavior
        run: node --test tests/pages-api-relay.test.mjs
      - name: Check Cloudflare credentials without exposing them
        id: credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment skipped. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."
          fi
      - name: Deploy dedicated Aurora API Worker
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.102.0"
          command: deploy --config wrangler.pages-api.toml
