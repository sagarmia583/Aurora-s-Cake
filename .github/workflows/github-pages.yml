name: Publish Aurora's Cake to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AURORA_GITHUB_PAGES: "true"
      VITE_GITHUB_PAGES_READ_ONLY: "true"
      NETLIFY: "false"
      VITE_SHEETS_POST_PROXY: ""
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Build Vite project for /Aurora-s-Cake/
        run: npm run build
      - name: Support direct /cake and /track-order links
        run: cp dist/index.html dist/404.html
      - name: Verify Pages artifact and protect against unsafe writes
        run: node scripts/check-github-pages-build.mjs
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload built site, not raw source
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
