# Cloudflare Workers + Static Assets deploy target.
# This is the existing aurora-s-cake.sagarmia583.workers.dev project,
# NOT a Cloudflare Pages project. Keep JSON secrets in the Workers dashboard.
name = "aurora-s-cake"
main = "./cloudflare/worker.js"
compatibility_date = "2026-10-29"
# Preserve text runtime variables entered in Cloudflare Dashboard across
# GitHub Workers Builds deployments. Encrypted secrets are still dashboard-only.
keep_vars = true

[vars]
DEPLOYMENT_PLATFORM = "cloudflare_worker"
# Public deployment address, already bundled in the storefront. This is not a credential.
# Keep the server relay pinned to the same approved Apps Script deployment.
AURORA_SCRIPT_POST_URL = "https://script.google.com/macros/s/AKfycbw38J4AzlYkAhNtyDAp_CP34fUk9Epae6xz46AQFbF9ye1VsZjxTXmzbJgs52WEoWETMw/exec"
# Enables server-only *secondary order mirroring*, not Firebase-primary.
# No order is mirrored until authoritative backend confirms it and
# FIREBASE_SERVICE_ACCOUNT_JSON is configured as an encrypted Worker Secret.
FIREBASE_MIRROR_ENABLED = "false"
# Phase 1: isolated public catalog read-only API. The live storefront still
# uses its previous backend until catalog import and checkout migration.
FIREBASE_PRIMARY_CATALOG_ENABLED = "false"
# Phase 2: independent Firebase Auth + private staff_roles, GET-only APIs.
# Does NOT replace the production legacy staff portal until tested.
FIREBASE_PRIMARY_STAFF_ENABLED = "false"
# New D1/R2 migration remains OFF until real bindings, migrations, backups,
# Cloudflare Access and acceptance tests are verified. No dummy DB UUID.
D1_PREVIEW_ENABLED = "false"
D1_MUTATIONS_ENABLED = "false"

# Existing owner-created D1 database. This ID is a non-secret resource identifier.
# Applying this binding does NOT apply migrations or transfer historical data.
[[d1_databases]]
binding = "AURORA_DB"
database_name = "aurora-cake-db"
database_id = "71790429-c38a-483e-a0db-3fa7cfc4ba40"
migrations_dir = "cloudflare/d1/migrations"

# R2 binding awaits confirmation that the owner created aurora-cake-media.
# Add [[r2_buckets]] binding="AURORA_MEDIA" only after bucket exists.


[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
